name: 'publish'

# Multi-platform release pipeline with a deterministic updater manifest.
#
# Design (race-free by construction):
#   build-linux   → workflow artifacts only, never touches the release
#   build-windows → workflow artifacts only, never touches the release
#   release       → runs once both finish: uploads everything to the tag's
#                   release and publishes ONE merged latest.json covering
#                   exactly the targets that were actually built.
#
# No job generates latest.json except the final one, so independent jobs
# can never overwrite each other's manifest entries.
#
# Flow: create the release first (`gh release create vX.Y.Z`, any state)
# and push the tag — or just push the tag and let the final job create
# a draft. Either way the final job fills the same release.

on:
  push:
    tags:
      - 'v*'

jobs:
  build-linux:
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install Linux webview deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf xdg-utils

      - name: install frontend dependencies
        run: npm install

      - name: run checks
        run: |
          npx tsc --noEmit
          npx vitest run

      - name: build Linux bundles (no release upload here)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: stash Linux bundles + signatures
        uses: actions/upload-artifact@v4
        with:
          name: bundles-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/appimage/*.AppImage.tar.gz
            src-tauri/target/release/bundle/**/*.sig

  build-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: setup node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: install frontend dependencies
        run: npm install

      - name: build Windows bundles (no release upload here)
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: stash Windows bundles + signatures
        uses: actions/upload-artifact@v4
        with:
          name: bundles-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/nsis/*.nsis.zip
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/**/*.sig

  release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - name: collect all platform bundles
        uses: actions/download-artifact@v4
        with:
          pattern: bundles-*
          merge-multiple: true
          path: dist-assets

      - name: ensure the tag's release exists (never changes its state)
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --title "30Day $TAG" \
              --notes "Automated multi-platform release." --draft
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: write merged latest.json (only targets actually built)
        run: |
          python3 - <<'EOF'
          import glob
          import json
          import os
          from datetime import datetime, timezone

          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          version = tag[1:] if tag.startswith("v") else tag

          # Updater consumes these artifacts (NOT the manual installers):
          #   Windows -> *-setup.nsis.zip | Linux -> *.AppImage.tar.gz
          # (recursive globs: download-artifact preserves subdirectories.
          #  NOTE: python glob needs recursive=True for ** to recurse.)
          wanted = {
              "windows-x86_64": ("dist-assets/**/*-setup.nsis.zip",),
              "linux-x86_64": ("dist-assets/**/*.AppImage.tar.gz",),
          }
          platforms = {}
          for target, patterns in wanted.items():
              matches = [p for pat in patterns for p in glob.glob(pat, recursive=True)]
              if len(matches) != 1:
                  raise SystemExit(f"expected exactly 1 {target} updater bundle, found {matches}")
              bundle = matches[0]
              sig_path = bundle + ".sig"
              if not os.path.isfile(sig_path):
                  raise SystemExit(f"missing signature sidecar: {sig_path}")
              with open(sig_path, encoding="utf-8") as f:
                  signature = f.read().strip()
              name = os.path.basename(bundle)
              platforms[target] = {
                  "signature": signature,
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              }

          manifest = {
              "version": version,
              "notes": "",
              "pub_date": datetime.now(timezone.utc).isoformat(),
              "platforms": platforms,
          }
          with open("dist-assets/latest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, indent=2)
          print("platforms:", sorted(platforms))
          EOF

      - name: upload everything to the release
        run: gh release upload "$TAG" dist-assets/* --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
